name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore NetCat.sln

      - name: Install reviewed release modules
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $bundleArchive = Join-Path $env:RUNNER_TEMP 'NetCat-v1.0.0-win-x64.zip'
          $bundleStage = Join-Path $env:RUNNER_TEMP 'NetCat-reviewed-v1.0.0'
          $moduleRoot = Join-Path $PWD 'bin'
          Invoke-WebRequest 'https://github.com/akapustyanik/NetCat/releases/download/v1.0.0/NetCat-v1.0.0-win-x64.zip' -OutFile $bundleArchive
          $expected = '524e7708f8f4144e244e0fb4d6a7fa8bbe52098dc92b2b01458a25f96f494dc8'
          if ((Get-FileHash -LiteralPath $bundleArchive -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) {
            throw 'Reviewed release bundle SHA256 mismatch'
          }
          Expand-Archive -LiteralPath $bundleArchive -DestinationPath $bundleStage
          New-Item -ItemType Directory -Force -Path $moduleRoot | Out-Null
          foreach ($entry in Get-ChildItem -LiteralPath (Join-Path $bundleStage 'modules')) {
            Copy-Item -LiteralPath $entry.FullName -Destination $moduleRoot -Recurse
          }
          python -B scripts/Add-TelegramHttp2Runtime.py --runtime (Join-Path $moduleRoot 'tg-runtime') --cache (Join-Path $env:RUNNER_TEMP 'telegram-http2-wheels')
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed Telegram HTTP/2 dependencies failed' }

      - name: Run tests
        run: dotnet test NetCat.sln -c Release --no-restore
