name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.425'

      - name: Restore dependencies
        run: dotnet restore NetCat.sln

      - name: Fetch verified release modules
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = 'Stop'
          & ./scripts/Fetch-OfficialModules.ps1
          & ./scripts/Fetch-TelegramHeadless.ps1
          & ./scripts/Fetch-Geodata.ps1

      - name: Stage previous reviewed package for upgrade regression tests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $archive = Join-Path $env:RUNNER_TEMP 'NetCat-v1.0.2-win-x64.zip'
          $stage = Join-Path $env:RUNNER_TEMP 'NetCat-previous-reviewed'
          Invoke-WebRequest 'https://github.com/akapustyanik/NetCat/releases/download/v1.0.2/NetCat-v1.0.2-win-x64.zip' -OutFile $archive
          if ((Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant() -ne 'ab30f9fbdcbe5827e360912b41c4b5ea5f31e8bde692030d6afe101b7a952b13') {
            throw 'Previous reviewed release SHA256 mismatch'
          }
          Expand-Archive -LiteralPath $archive -DestinationPath $stage
          $destination = Join-Path $PWD 'artifacts/previous-reviewed-modules'
          New-Item -ItemType Directory -Force -Path $destination | Out-Null
          foreach ($entry in Get-ChildItem -LiteralPath (Join-Path $stage 'modules')) {
            Copy-Item -LiteralPath $entry.FullName -Destination $destination -Recurse
          }
          # These components have not changed since 1.0.2. Use their exact
          # reviewed distributions, including OpenSSL policy and Python wheels.
          $moduleRoot = [IO.Path]::GetFullPath((Join-Path $PWD 'bin'))
          foreach ($key in @('openvpn', 'tg-runtime')) {
            $target = [IO.Path]::GetFullPath((Join-Path $moduleRoot $key))
            if (-not $target.StartsWith($moduleRoot + [IO.Path]::DirectorySeparatorChar, [StringComparison]::OrdinalIgnoreCase)) {
              throw 'Component directory is outside the module root'
            }
            Remove-Item -LiteralPath $target -Recurse -Force
            Copy-Item -LiteralPath (Join-Path $stage "modules/$key") -Destination $moduleRoot -Recurse
          }
      - name: Run tests
        run: dotnet test NetCat.sln -c Release --no-restore -warnaserror
